name: Publish INVITO Studio preview to GitHub Pages

on:
  push:
    branches:
      - feat/invito-template-studio-mvp-20261116
    paths:
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/studio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "invito-studio-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build isolated static Studio (no application backend)
        shell: bash
        env:
          NEXT_PUBLIC_PAGES_BASE_PATH: /invito
        run: |
          set -euo pipefail
          rm -rf 'src/app/[locale]/templates' 'src/app/[locale]/editor' 'src/app/[locale]/i'
          rm 'src/app/[locale]/page.tsx'
          cat > next.config.ts <<'CONFIG'
          import type { NextConfig } from "next";
          const config: NextConfig = {
            output: "export",
            basePath: "/invito",
            images: { unoptimized: true },
            trailingSlash: true,
          };
          export default config;
          CONFIG
          npm run build
          test -f out/ru/admin/studio/index.html
          touch out/.nojekyll
          cat > out/index.html <<'HTML'
          <!doctype html>
          <html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0;url=/invito/ru/admin/studio/">
          <title>INVITO Studio Preview</title></head>
          <body><a href="/invito/ru/admin/studio/">Открыть INVITO Studio</a></body></html>
          HTML
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload generated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
