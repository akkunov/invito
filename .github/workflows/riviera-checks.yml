name: INVITO template checks

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:riviera
      - run: npm run test:monochrome
      - run: npm run test:santorini
      - run: npm run test:landing
      - run: npm run test:studio
      - run: npm run test:studio-v2-core
      - run: npm run test:studio-v2-commands
      - run: npm run test:studio-v2-viewport
      - run: npm run test:studio-v2-ui
      - run: npm run test:studio-v2-selection
      - run: npm run test:studio-v2-layout
      - run: npm run test:studio-v2-rich-text
      - run: npm run test:studio-v2-assets
      - run: npm run test:studio-v2-responsive
      - run: npm run test:studio-v2-invitation
      - run: npm run test:studio-v2-canvas-pro
      - run: npm run test:studio-v2-appearance
      - run: npm run test:studio-v2-linked-components
      - run: npm run test:studio-v2-style-tokens
      - run: npm run test:studio-v2-motion
      - run: npm run test:editor-navigation
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:public-routes
      - name: Build exact GitHub Pages static preview
        run: bash scripts/build-studio-pages.sh
      - name: Install Chromium
        run: bash scripts/install-studio-browser.sh
      - name: Test static preview in Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pages-root"
          ln -s "$GITHUB_WORKSPACE/out" "$RUNNER_TEMP/pages-root/invito"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$RUNNER_TEMP/pages-root" > "$RUNNER_TEMP/studio-http.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/invito/studio-build.txt && break; sleep 1; done
          node scripts/test-studio-v2-browser.mjs
      - name: Upload Studio browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-pr
          path: studio-browser-artifacts/
          if-no-files-found: ignore
