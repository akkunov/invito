name: INVITO template checks

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:riviera
      - run: npm run test:monochrome
      - run: npm run test:santorini
      - run: npm run test:landing
      - run: npm run test:studio
      - run: npm run test:studio-v2-core
      - run: npm run test:studio-v2-commands
      - run: npm run test:studio-v2-viewport
      - run: npm run test:studio-v2-ui
      - run: npm run test:editor-navigation
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:public-routes
