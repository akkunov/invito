name: INVITO Backend Core
on:
  push:
    branches: [main, feat/29-2-backend-core]
    paths:
      - 'server/**'
      - '.github/workflows/backend-core.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend-core.yml'

permissions:
  contents: read

jobs:
  postgres-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: invito_ci
          POSTGRES_USER: invito
          POSTGRES_PASSWORD: invito_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U invito -d invito_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: postgresql://invito:invito_ci_only@127.0.0.1:5432/invito_ci?schema=public
      DIRECT_DATABASE_URL: postgresql://invito:invito_ci_only@127.0.0.1:5432/invito_ci?schema=public
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      # Until the first independently generated server/package-lock.json is committed.
      - name: Install isolated API dependencies
        run: npm install --no-audit --no-fund
      - name: Prisma schema validation
        run: npm exec prisma validate -- --config prisma.config.ts
      - name: Compile API and generated Prisma Client
        run: npm run build
      - name: Apply migrations to disposable PostgreSQL
        run: npm run db:migrate:deploy
      - name: E2E integration tests (real PostgreSQL)
        run: npm test
      - name: Upload reproducible lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: invito-api-package-lock
          path: server/package-lock.json
