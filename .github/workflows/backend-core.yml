name: INVITO Backend Core
on:
  push:
    branches: [main, feat/29-5-publishing-rsvp]
    paths:
      - 'tsconfig.json'
      - 'src/features/studio-v2/browser/remote-sync.ts'
      - 'src/components/studio-v2/**'
      - 'src/app/studio-v2.css'
      - 'scripts/test-studio-v2-remote-sync.mjs'
      - 'scripts/test-studio-v2-cloud-media.mjs'
      - 'src/features/studio-v2/browser/cloud-media.ts'
      - 'package.json'
      - 'server/**'
      - '.github/workflows/backend-core.yml'
  pull_request:
    paths:
      - 'tsconfig.json'
      - 'src/features/studio-v2/browser/remote-sync.ts'
      - 'src/components/studio-v2/**'
      - 'src/app/studio-v2.css'
      - 'scripts/test-studio-v2-remote-sync.mjs'
      - 'package.json'
      - 'server/**'
      - '.github/workflows/backend-core.yml'

concurrency:
  group: backend-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: invito_ci
          POSTGRES_USER: invito
          POSTGRES_PASSWORD: invito_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U invito -d invito_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      DATABASE_URL: postgresql://invito:invito_ci_only@127.0.0.1:5432/invito_ci?schema=public
      DIRECT_DATABASE_URL: postgresql://invito:invito_ci_only@127.0.0.1:5432/invito_ci?schema=public
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install isolated API dependencies
        run: npm ci --no-audit --no-fund
      - name: Install shared Studio v2 schema dependencies
        run: npm ci --prefix .. --no-audit --no-fund
      - name: Prisma schema validation
        run: npm exec prisma validate -- --config prisma.config.ts
      - name: Compile API and generated Prisma Client
        run: npm run build
      - name: Apply migrations to disposable PostgreSQL
        run: npm run db:migrate:deploy
      - name: E2E integration tests (real PostgreSQL)
        run: npm test
      - name: Smoke test compiled Node runtime
        run: |
          npm start >/tmp/invito-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4000/api/v1/health/ready | grep -q ready; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat /tmp/invito-api.log
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:4000/api/v1/openapi.json > /tmp/invito-openapi.json
          node -e '
            const fs=require("fs");
            const doc=JSON.parse(fs.readFileSync("/tmp/invito-openapi.json","utf8"));
            if(!doc.openapi?.startsWith("3.") ||
               !doc.components?.securitySchemes?.BearerAuth ||
               !doc.paths?.["/api/v1/projects/{id}/revisions"]?.put ||
               !doc.paths?.["/api/v1/public/invitations/{slug}/rsvp"]?.post ||
               Object.keys(doc.paths||{}).length < 20) process.exit(1);
            const pub=doc.paths["/api/v1/public/invitations/{slug}/rsvp"].post;
            if(pub.security?.length) process.exit(1);
            const create=doc.paths["/api/v1/workspaces"].post.requestBody.content["application/json"].schema;
            const invite=doc.paths["/api/v1/public/invitations/{slug}/rsvp"].post.requestBody.content["application/json"].schema;
            const upload=doc.paths["/api/v1/workspaces/{workspaceId}/media/uploads"].post.requestBody.content["application/json"].schema;
            const params=doc.paths["/api/v1/projects/{id}/revisions/{number}"].get.parameters;
            console.log("Swagger schema snapshot:",JSON.stringify({create,invite,upload,params}).slice(0,6500));
            if(!create.required.includes("name") || create.properties.name.maxLength!==120 ||
               !create.properties.slug.pattern || create.additionalProperties!==false ||
               !invite.properties.attendance.enum.includes("yes") ||
               invite.properties.guests.maximum!==10 || !invite.required.includes("nodeId") ||
               !upload.properties.mimeType.enum.includes("audio/mpeg") ||
               !params.some(p=>p.name==="number" && p.required && p.schema.minimum===1) ||
               !params.some(p=>p.name==="id" && p.required && p.schema.format==="uuid")) process.exit(1);
            console.log("OpenAPI request contracts verified against Zod validators");
            console.log("OpenAPI JSON verified: "+Object.keys(doc.paths).length+" paths");
          '
 
  frontend-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install frontend independently
        run: npm ci --no-audit --no-fund
      - name: Verify root frontend TypeScript
        run: npm run typecheck
      - name: Verify existing backend-domain contracts
        run: npm run test:backend-contract
      - name: Verify remote sync conflict and offline behavior
        run: npm run test:studio-v2-remote-sync
      - name: Verify cloud media upload transport and immutable local copies
        run: npm run test:studio-v2-cloud-media
      - name: Verify music widget and invitation block regression
        run: npm run test:studio-v2-invitation
