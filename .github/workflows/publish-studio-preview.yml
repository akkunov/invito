name: Publish INVITO Studio preview
# Preview includes canvas v2 geometry, typography and media uploads.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-studio-preview.yml"
      - "src/features/studio-v2/**"
      - "src/components/studio-v2/**"
      - "src/app/studio-v2.css"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "src/app/[locale]/admin/studio-v2/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "invito-studio-preview"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Studio interactions and TypeScript
        run: |
          npm run test:studio
          node scripts/test-studio-interactions.mjs
          node scripts/test-studio-canvas-v2.mjs
          npm run test:studio-v2-core
          npm run test:studio-v2-commands
          npm run test:studio-v2-viewport
          npm run test:studio-v2-ui
          npm run test:studio-v2-selection
          npm run test:studio-v2-layout
          npm run test:studio-v2-rich-text
          npm run test:studio-v2-assets
          npm run test:studio-v2-responsive
          npm run test:studio-v2-invitation
          npm run test:studio-v2-canvas-pro
          npm run test:studio-v2-appearance
          npm run test:studio-v2-linked-components
          npm run test:studio-v2-style-tokens
          npm run test:studio-v2-motion
          npm run typecheck
      - name: Export only Studio as a static Pages site
        run: bash scripts/build-studio-pages.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Install Chromium
        run: bash scripts/install-studio-browser.sh
      - name: Verify deployed commit and browser behavior on GitHub Pages
        env:
          STUDIO_TEST_URL: https://akkunov.github.io/invito
          STUDIO_EXPECT_SHA: ${{ github.sha }}
        run: node scripts/test-studio-v2-browser.mjs
      - name: Upload deployed browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-pages
          path: studio-browser-artifacts/
          if-no-files-found: ignore
