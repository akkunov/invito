name: INVITO 29.4 update backend lockfile
on:
  push:
    branches: [feat/29-4-media-storage]
    paths:
      - '.github/workflows/29-4-lockfile-bootstrap.yml'
      - 'server/package.json'
permissions:
  contents: write
jobs:
  generate:
    if: github.ref == 'refs/heads/feat/29-4-media-storage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Lock backend dependencies
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(api): lock Cloudflare R2 media dependencies"
            git push origin HEAD:feat/29-4-media-storage
          fi
