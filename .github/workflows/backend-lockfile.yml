# Temporary one-shot workflow to generate and commit the server lockfile.
# Kept isolated from pull_request events; only runs on our feature branch.
name: INVITO API lockfile bootstrap
on:
  push:
    branches: [feat/29-2-backend-core]
    paths:
      - '.github/workflows/backend-lockfile.yml'
      - 'server/package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feat/29-2-backend-core'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Generate lockfile without dependency scripts
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(api): lock isolated NestJS dependencies"
            git push origin HEAD:feat/29-2-backend-core
          fi
