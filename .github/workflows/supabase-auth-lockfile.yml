name: Refresh Supabase Auth package-lock once
on:
  push:
    branches: [feat/supabase-cloud-auth]
    paths:
      - package.json
      - .github/workflows/supabase-auth-lockfile.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Update root package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(auth): lock Supabase browser dependencies"
            git push
          fi
